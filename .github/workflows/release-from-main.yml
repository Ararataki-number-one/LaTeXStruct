name: release-from-main

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: latexstruct-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch-build-and-release:
    if: startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验发布版本
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from latexstruct._version import __version__; print(__version__)')"
          EXPECTED_PREFIX="release: v${VERSION}"
          MESSAGE="$COMMIT_MESSAGE"
          if [[ "$MESSAGE" != "$EXPECTED_PREFIX"* ]]; then
            echo "发布提交与版本文件不一致: expected prefix=$EXPECTED_PREFIX" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} 已存在，拒绝覆盖" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 调度正式 Windows 构建
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh workflow run build.yml --ref main -f version="$VERSION"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow build.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,headSha,createdAt --jq '.[] | select(.headSha == "${{ github.sha }}") | .databaseId' | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 3
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "未找到刚刚调度的 build.yml 工作流" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "正式构建运行 ID: $RUN_ID"

      - name: 等待测试、安装包构建与冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --exit-status

      - name: 下载正式构建产物
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts
          gh run download "${{ steps.dispatch.outputs.run_id }}" \
            --name "LaTeXStruct-v${VERSION}" \
            --dir release-artifacts
          test -f "release-artifacts/LaTeXStruct-portable-${VERSION}.zip"
          test -f "release-artifacts/LaTeXStruct-setup-${VERSION}.exe"

      - name: 校验发布说明与工件摘要
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/v${VERSION}.md"
          test -s "$NOTES"
          sha256sum release-artifacts/* | tee release-artifacts/SHA256SUMS.txt

      - name: 创建 tag 与 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "release-artifacts/LaTeXStruct-portable-${VERSION}.zip" \
            "release-artifacts/LaTeXStruct-setup-${VERSION}.exe" \
            "release-artifacts/SHA256SUMS.txt" \
            --target "${{ github.sha }}" \
            --title "LaTeXStruct v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md" \
            --latest
