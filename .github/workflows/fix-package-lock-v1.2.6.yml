name: fix-package-lock-v1.2.6

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-package-lock-v1.2.6.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'release/v1.2.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.6
          fetch-depth: 0

      - name: Synchronize the lockfile version and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('frontend/package-lock.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = '1.2.6'
          data.setdefault('packages', {}).setdefault('', {})['version'] = '1.2.6'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/fix-package-lock-v1.2.6.yml

      - name: Commit the synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/fix-package-lock-v1.2.6.yml
          git commit -m "chore: synchronize v1.2.6 frontend lockfile"
          git push origin HEAD:release/v1.2.6
