name: apply-ai-audit-submission-patch

on:
  push:
    branches: [feature/ai-audit-submission]
    paths:
      - ".github/audit-payload/**"
      - ".github/workflows/apply-ai-audit-submission-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-audit-submission
          fetch-depth: 0

      - name: Verify and extract implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/audit-payload/part-* > "$RUNNER_TEMP/audit-patch.b64"
          echo "e2baac2a22eb81bd744831c04d0668f9d47a25188301cbc0977a386fc73512b9  $RUNNER_TEMP/audit-patch.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/audit-patch.b64" > "$RUNNER_TEMP/audit-patch.zip"
          echo "39edaeec08798e9053cd31e1b405a55e2804b41cf4f7501ace127ef0517b8e76  $RUNNER_TEMP/audit-patch.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path(__import__('os').environ['RUNNER_TEMP']) / 'audit-patch.zip'
          expected = {
              'latexstruct/core/audit_schema.py',
              'latexstruct/core/audit_prompt.py',
              'latexstruct/core/audit_submission.py',
              'latexstruct/server/audit_api.py',
              'latexstruct/server/factory.py',
              'latexstruct/__main__.py',
              'latexstruct/_version.py',
              'frontend/src/AuditSubmissionLauncher.jsx',
              'frontend/src/main.jsx',
              'frontend/package.json',
              'tests/test_audit_submission.py',
              '.github/workflows/pr-check.yml',
              '.github/workflows/release-orchestrator.yml',
              'RELEASE_NOTES_v1.2.6.md',
          }
          with zipfile.ZipFile(archive) as zf:
              names = {item.filename for item in zf.infolist() if not item.is_dir()}
              if names != expected:
                  raise SystemExit(f'unexpected payload members: {sorted(names ^ expected)}')
              for item in zf.infolist():
                  if item.is_dir():
                      continue
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path: {item.filename}')
                  target = Path(item.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(item))
          PY

      - name: Synchronize version metadata and release documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          lock_path = Path('frontend/package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = '1.2.6'
          lock.setdefault('packages', {}).setdefault('', {})['version'] = '1.2.6'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## Unreleased\n'
          section = '''\n## v1.2.6（2026-08-22）\n\n- 新增“一键生成 AI 审计提交包”：宿主程序基于不可变 RunSnapshot 收集 OCR、分析、审阅、模板转换和多文件项目的真实阶段工件，确定文件角色、终态、SHA-256 与父子关系；\n- 支持 quick/standard/full 三档以及 SUCCESS、UNVERIFIED、FAILED、PARTIAL、CANCELLED 全部终态，失败任务同样保留已有 TeX、错误日志和诚实预览；\n- 自动生成 README、短提示词、完整提示词、manifest、diff、问题 CSV、verification、decisions、编译日志与 SHA256SUMS；提示词只引用实际存在的工件，不能自行把 UNVERIFIED 提升为 VERIFIED；\n- 严格区分 COMPILED、PARTIAL_COMPILED 与 SOURCE_PREVIEW；默认清理 API Key、Authorization、GitHub token 和本机绝对路径，并按 bytes SHA-256 去重、记录 aliases；\n- 新增审计包 API、全局生成弹窗、复制提交话术、下载、打开目录与 stale 检测；原有导出 TEX 和工程 ZIP 行为保持不变。\n'''
          if '## v1.2.6（2026-08-22）' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG Unreleased marker missing')
              text = text.replace(marker, marker + section, 1)
              changelog.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('## 当前状态（v1.2.5）', '## 当前状态（v1.2.6）')
          status_marker = '## 当前状态（v1.2.6）\n'
          audit_note = '''\n- 工作台新增“一键生成 AI 审计提交包”：自动冻结当前 RunSnapshot、整理真实源文件/阶段 TeX/编译预览/验证与决策记录，生成可直接提交给 ChatGPT/Codex 的 ZIP 和提示词；文件角色、状态、哈希与血缘全部由宿主程序确定。\n'''
          if status_marker in readme_text and '一键生成 AI 审计提交包' not in readme_text:
              readme_text = readme_text.replace(status_marker, status_marker + audit_note, 1)
          readme.write_text(readme_text, encoding='utf-8')

          build = Path('.github/workflows/build.yml')
          build_text = build.read_text(encoding='utf-8')
          build_text = build_text.replace("$previousVersion = '1.2.4'", "$previousVersion = '1.2.5'")
          build.write_text(build_text, encoding='utf-8')
          PY

      - name: Remove bootstrap payload and validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/audit-payload .github/workflows/apply-ai-audit-submission-patch.yml
          python -m py_compile \
            latexstruct/core/audit_schema.py \
            latexstruct/core/audit_prompt.py \
            latexstruct/core/audit_submission.py \
            latexstruct/server/audit_api.py \
            latexstruct/server/factory.py \
            latexstruct/__main__.py \
            tests/test_audit_submission.py

      - name: Commit implementation to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: add one-click AI audit submission bundles"
          git push origin HEAD:feature/ai-audit-submission
