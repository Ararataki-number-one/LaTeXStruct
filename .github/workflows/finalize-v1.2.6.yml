name: finalize-v1.2.6

on:
  push:
    branches: ["release/v1.2.6"]
    paths:
      - ".github/workflows/finalize-v1.2.6.yml"

permissions:
  contents: write

concurrency:
  group: finalize-v1.2.6
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.6
          fetch-depth: 0

      - name: Clean bootstrap files and synchronize v1.2.6 metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/audit-payload
          rm -f .github/workflows/apply-ai-audit-submission-patch.yml
          rm -f .github/workflows/publish-ai-audit-v1.2.6.yml
          rm -f .github/workflows/finalize-v1.2.6.yml

          python - <<'PY'
          from pathlib import Path
          import json

          version_path = Path("latexstruct/_version.py")
          version_text = version_path.read_text(encoding="utf-8")
          old_version = '__version__ = "1.2.5"'
          new_version = '__version__ = "1.2.6"'
          if new_version not in version_text:
              if old_version not in version_text:
                  raise SystemExit("Unexpected Python version source")
              version_path.write_text(version_text.replace(old_version, new_version, 1), encoding="utf-8")

          for path_string in ("frontend/package.json", "frontend/package-lock.json"):
              path = Path(path_string)
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = "1.2.6"
              if path.name == "package-lock.json":
                  data.setdefault("packages", {}).setdefault("", {})["version"] = "1.2.6"
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          section_heading = "## v1.2.6（2026-08-22）"
          if section_heading not in changelog_text:
              marker = "## Unreleased\n"
              if marker not in changelog_text:
                  raise SystemExit("CHANGELOG Unreleased marker missing")
              section = '''
## v1.2.6（2026-08-22）

- 新增“一键生成 AI 审计提交包”：宿主程序基于不可变 RunSnapshot 收集 OCR、分析、审阅、模板转换和多文件项目的真实阶段工件，确定文件角色、终态、SHA-256 与父子关系；
- 支持 quick、standard、full 三档以及 SUCCESS、UNVERIFIED、FAILED、PARTIAL、CANCELLED 全部终态，失败任务同样保留已有 TeX、错误日志和诚实预览；
- 自动生成 README、短提示词、完整提示词、manifest、diff、问题 CSV、verification、decisions、编译日志与 SHA256SUMS；提示词只引用实际存在的工件，不能自行把 UNVERIFIED 提升为 VERIFIED；
- 严格区分 COMPILED、PARTIAL_COMPILED 与 SOURCE_PREVIEW；默认清理 API Key、Authorization、GitHub token 和本机绝对路径，并按 bytes SHA-256 去重、记录 aliases；
- 新增审计包 API、生成弹窗、复制提交话术、下载、打开目录与 stale 检测；原有导出 TEX 和工程 ZIP 行为保持不变。
'''
              changelog.write_text(changelog_text.replace(marker, marker + section, 1), encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace("## 当前状态（v1.2.5）", "## 当前状态（v1.2.6）")
          status_marker = "## 当前状态（v1.2.6）\n"
          audit_note = (
              "\n- 工作台新增“一键生成 AI 审计提交包”：自动冻结当前 RunSnapshot、整理真实源文件、"
              "阶段 TeX、编译预览、验证与决策记录，生成可直接提交给 ChatGPT/Codex 的 ZIP 和提示词；"
              "文件角色、状态、哈希与血缘全部由宿主程序确定。\n"
          )
          if status_marker in readme_text and "工作台新增“一键生成 AI 审计提交包”" not in readme_text:
              readme_text = readme_text.replace(status_marker, status_marker + audit_note, 1)
          readme.write_text(readme_text, encoding="utf-8")

          build = Path(".github/workflows/build.yml")
          build_text = build.read_text(encoding="utf-8")
          build_text = build_text.replace("$previousVersion = '1.2.4'", "$previousVersion = '1.2.5'")
          build.write_text(build_text, encoding="utf-8")

          release_workflow = Path(".github/workflows/release-from-main.yml")
          release_text = release_workflow.read_text(encoding="utf-8")
          unsafe_header = '''      - name: 校验发布版本
        id: version
        shell: bash
        run: |
'''
          safe_header = '''      - name: 校验发布版本
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
'''
          if unsafe_header in release_text:
              release_text = release_text.replace(unsafe_header, safe_header, 1)
          release_text = release_text.replace(
              'MESSAGE="${{ github.event.head_commit.message }}"',
              'MESSAGE="$COMMIT_MESSAGE"',
          )
          release_workflow.write_text(release_text, encoding="utf-8")
          PY

          python -m py_compile \
            latexstruct/core/audit_schema.py \
            latexstruct/core/audit_prompt.py \
            latexstruct/core/audit_submission.py \
            latexstruct/server/audit_submission_routes.py \
            latexstruct/__main__.py \
            tests/test_audit_submission.py

      - name: Commit the clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "chore: finalize v1.2.6 release candidate"
          git push origin HEAD:release/v1.2.6
