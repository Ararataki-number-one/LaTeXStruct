name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建版本（留空则使用 latexstruct/_version.py）"
        required: false
        type: string
      run_analysis_37:
        description: "构建后调用同一提交的私有 37 页完整验收"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "本次 analysis-37 一次性 JIT runner 的随机唯一标签"
        required: false
        type: string

jobs:
  test:
    name: 测试（Windows / Python 3.13）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: python -m pip install -r requirements.txt ruff
      - name: 静态检查（ruff F/E741/W605 规则）
        run: python -m ruff check latexstruct tests tools packaging benchmark
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: 安装 TinyTeX（Compile CI）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 用 GITHUB_TOKEN 认证 GitHub API（匿名调用在共享 runner IP 上频繁触发限流，
          # 曾导致误报 CI 失败）；带 3 次退避重试。
          $rel = $null
          for ($i = 0; $i -lt 3 -and -not $rel; $i++) {
            try {
              $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'latexstruct-ci'; `
                'Authorization' = "Bearer $env:GITHUB_TOKEN" } `
                https://api.github.com/repos/rstudio/tinytex-releases/releases/latest
            } catch { Start-Sleep -Seconds (5 * ($i + 1)) }
          }
          if (-not $rel) { Write-Error "TinyTeX 版本查询失败（API 限流）"; exit 1 }
          $asset = $rel.assets | Where-Object { $_.name -like 'TinyTeX-0-windows-v*.exe' } | Select-Object -First 1
          if (-not $asset) { Write-Error "未找到 TinyTeX Windows 资产"; exit 1 }
          $exe = Join-Path $env:RUNNER_TEMP 'tinytex.exe'
          Invoke-WebRequest $asset.browser_download_url -OutFile $exe
          $root = Join-Path $env:RUNNER_TEMP 'tinytex'
          & $exe -o"$root" -y
          if ($LASTEXITCODE -ne 0) { Write-Error "TinyTeX 解压失败"; exit 1 }
          $tlmgr = Get-ChildItem -Path $root -Recurse -Filter tlmgr.bat | Select-Object -First 1
          if (-not $tlmgr) { Write-Error "解压后未找到 tlmgr"; exit 1 }
          $bin = $tlmgr.DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          # TinyTeX 发布包与滚动更新的软件仓库之间可能存在一个短暂版本差。
          # TeX Live 要求先更新 tlmgr 自身，否则后续 install 会提前终止且可能返回 0。
          & $tlmgr.FullName update --self
          if ($LASTEXITCODE -ne 0) { Write-Error "TinyTeX 包管理器更新失败"; exit 1 }
          # amssymb.sty 属于 amsfonts，amsthm.sty 属于 amscls；这里必须使用
          # TeX Live 的发行包名，而不是 .sty 文件名。ElegantBook 没有在
          # TeX Live 元数据中声明全部运行时依赖，OCR_PREAMBLE 也会直接加载
          # 数学、表格和 TikZ-CD 包；因此必须显式安装并在后面逐文件验证。
          # bbm.sty 属于 bbm-macros，而其字体属于 bbm，两者均需安装。
          & $tlmgr.FullName install xetex elegantbook amsmath amsfonts amscls geometry tcolorbox etoolbox graphics titlesec fancyhdr etoc caption microtype algorithms algorithmicx kvoptions float bbm bbm-macros fontspec tikzfill setspace csquotes hyperref tools comment newtx psnfss tex-gyre ctex anyfontsize esint xcolor colortbl mwe blindtext enumitem footmisc jknapltx rsfs fontname booktabs multirow fancyvrb makecell lipsum hologo appendix pgf tikz-cd apptools manfnt manfnt-font knuth-lib bbding adforn fixtounicode listings listingsutf8 incgraph tocloft pdfcol ltxcmds stmaryrd biblatex iftex environ logreq trimspaces adjustbox mdframed paratype unicode-math stix2-otf wasysym thmtools pdfpages bookmark
          if ($LASTEXITCODE -ne 0) { Write-Error "TinyTeX 依赖安装失败"; exit 1 }
          $kpsewhich = Join-Path $bin 'kpsewhich.exe'
          $xelatex = Join-Path $bin 'xelatex.exe'
          if (-not (Test-Path $kpsewhich)) { Write-Error "TinyTeX 缺少 kpsewhich"; exit 1 }
          if (-not (Test-Path $xelatex)) { Write-Error "TinyTeX 缺少 xelatex"; exit 1 }
          foreach ($file in @('elegantbook.cls', 'amsmath.sty', 'amssymb.sty', 'amsthm.sty', 'tcolorbox.sty', 'etoolbox.sty', 'titlesec.sty', 'fancyhdr.sty', 'etoc.sty', 'caption.sty', 'microtype.sty', 'algorithm.sty', 'algpseudocode.sty', 'kvoptions.sty', 'float.sty', 'bbm.sty', 'bbm10.mf', 'fontspec.sty', 'tikzfill.image.sty', 'setspace.sty', 'csquotes.sty', 'hyperref.sty', 'ltxcmds.sty', 'ctex.sty', 'xeCJK.sty', 'FandolSong-Regular.otf', 'esint.sty', 'stmaryrd.sty', 'rsfs10.tfm', 'texfonts.map', 'booktabs.sty', 'multirow.sty', 'tikz.sty', 'tikzlibrarycd.code.tex', 'biblatex.sty', 'logreq.sty', 'newtxmath.sty', 'TeXGyreTermesX-Regular.otf', 'texgyreheros-regular.otf', 'STIXTwoMath-Regular.otf', 'enumitem.sty', 'footmisc.sty', 'makecell.sty', 'appendix.sty', 'apptools.sty', 'pifont.sty', 'manfnt.sty', 'manfnt.pfb', 'manfnt.tfm', 'bbding.sty', 'adforn.sty', 'fixtounicode.sty', 'listings.sty', 'listingsutf8.sty', 'incgraph.sty', 'tocloft.sty', 'pdfcol.sty', 'trimspaces.sty', 'adjustbox.sty', 'mdframed.sty', 'paratype.sty', 'unicode-math.sty', 'wasysym.sty', 'tabularx.sty', 'thmtools.sty', 'pdfpages.sty', 'bookmark.sty', 'colortbl.sty')) {
            $resolved = & $kpsewhich $file
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resolved)) {
              Write-Error "TinyTeX 依赖缺失: $file"; exit 1
            }
            Write-Host "TinyTeX 依赖就绪: $file -> $resolved"
          }
          # GitHub Windows Server 不提供 SimSun/SimHei 等 CTeX 的默认 Windows
          # 字体。通过 CTeX 官方 ctexopts.cfg 入口只修改 CI 的默认字体集；
          # 用户源码显式传入的 fontset 选项仍会在其后覆盖这个默认值。
          $ctexCiRoot = Join-Path $env:GITHUB_WORKSPACE '.github\ci'
          $texInputs = ($ctexCiRoot -replace '\\', '/') + '//;'
          $env:TEXINPUTS = $texInputs
          Add-Content $env:GITHUB_ENV "TEXINPUTS=$texInputs"
          $expectedCtexOpts = [IO.Path]::GetFullPath((Join-Path $ctexCiRoot 'ctexopts.cfg'))
          $resolvedCtexOpts = & $kpsewhich 'ctexopts.cfg'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resolvedCtexOpts)) {
            Write-Error 'CI ctexopts.cfg 未被 TeX 发现'; exit 1
          }
          if ([IO.Path]::GetFullPath($resolvedCtexOpts.Trim()) -ne $expectedCtexOpts) {
            Write-Error "CTeX 配置来源错误: $resolvedCtexOpts"; exit 1
          }
          # XeTeX treats backslashes inside a command-line input path as TeX
          # control-sequence markers, so pass the absolute path with slashes.
          $probeTex = ((Join-Path $ctexCiRoot 'ctex-font-probe.tex') -replace '\\', '/')
          $probeDir = Join-Path $env:RUNNER_TEMP 'ctex-font-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $probeDirTeX = ($probeDir -replace '\\', '/')
          & $xelatex -halt-on-error -interaction=nonstopmode -file-line-error `
            "-output-directory=$probeDirTeX" $probeTex
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $probeDir 'ctex-font-probe.pdf'))) {
            Write-Error 'CTeX/Fandol 中文编译探针失败'; exit 1
          }
          $probeLog = Get-Content -LiteralPath (Join-Path $probeDir 'ctex-font-probe.log') -Raw
          if ($probeLog -notmatch 'ctex-fontset-fandol\.def' -or `
              $probeLog -match 'ctex-fontset-windows\.def') {
            Write-Error 'CTeX 未使用可移植的 Fandol 字体集'; exit 1
          }
          Write-Host 'CTeX/Fandol 中文编译探针通过'
      - name: 运行全部测试套件
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { Write-Error "测试失败"; exit 1 }
          python tools/benchmark.py | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Benchmark 未通过"; exit 1 }
          Write-Host "全部测试通过"
      - name: Benchmark（含前后编译对比）
        shell: pwsh
        run: |
          python tools/benchmark.py --compile
          $benchmarkExit = $LASTEXITCODE
          Get-Content benchmark/report.md
          if ($benchmarkExit -ne 0) { Write-Error "Benchmark（编译）未通过"; exit 1 }

  validate_acceptance_request:
    name: 校验可选 analysis-37 JIT runner 请求
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: 拒绝缺失、非随机或无关的 runner 标签
        shell: pwsh
        env:
          RUN_ANALYSIS_37: ${{ inputs.run_analysis_37 }}
          REQUESTED_RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          $enabled = ([string]$env:RUN_ANALYSIS_37).ToLowerInvariant() -eq 'true'
          $label = ([string]$env:REQUESTED_RUNNER_LABEL).Trim()
          if ($enabled -and $label -cnotmatch '^latexstruct-acceptance-[0-9a-f]{32}$') {
            Write-Error '启用 analysis-37 时必须提供本次 JIT runner 的随机唯一标签'
            exit 1
          }
          if (-not $enabled -and -not [string]::IsNullOrWhiteSpace($label)) {
            Write-Error '未启用 analysis-37 时不得提供 runner_label'
            exit 1
          }

  build_candidate:
    name: 构建待验收候选安装包（仅手动触发）
    needs: [test, validate_acceptance_request]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.candidate_version.outputs.app_version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 版本一致性校验（tag 与 __version__）
        id: candidate_version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            $v = $env:MANUAL_VERSION.TrimStart('v')
          } else {
            $v = python -c "from latexstruct._version import __version__; print(__version__)"
          }
          $v = $v.Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "版本格式无效: $v"; exit 1 }
          python -c "import latexstruct; assert latexstruct.__version__=='$v', f'版本不匹配: {latexstruct.__version__} vs $v'"
          echo "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "app_version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller "Pillow>=10,<12"
      - name: 生成图标与版本资源
        shell: pwsh
        run: |
          python packaging/generate_icon.py
          python packaging/sync_version.py --version $env:APP_VERSION
          python packaging/sync_build_identity.py --commit "$env:GITHUB_SHA" --build-id "$env:GITHUB_RUN_ID"
          python -c "import os; from latexstruct._build import BUILD_COMMIT, BUILD_ID; assert BUILD_COMMIT == os.environ['GITHUB_SHA'].lower(); assert BUILD_ID == os.environ['GITHUB_RUN_ID']"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建 React 前端（Monaco 工作台）
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: PyInstaller 构建单文件 exe
        run: python -m PyInstaller packaging/LaTeXStruct.spec --noconfirm --distpath dist --workpath build
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress
      - name: 构建安装器
        shell: pwsh
        run: |
          iscc "/DAppVersion=$env:APP_VERSION" packaging/installer.iss
          Get-ChildItem dist
      - name: 安装器冒烟测试（静默安装 → 运行健康检查 → 静默卸载）
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/LaTeXStruct-setup-*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "未找到安装器"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\LaTeXStruct-Smoke"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\LaTeXStruct.exe")) { Write-Error "安装后未找到 exe"; exit 1 }
          $notices = "$dir\THIRD_PARTY_NOTICES.txt"
          if (-not (Test-Path $notices)) { Write-Error "安装后未找到第三方许可证"; exit 1 }
          if (-not (Test-Path "$dir\LICENSE.txt")) { Write-Error "安装后未找到项目许可证"; exit 1 }
          $noticeText = Get-Content $notices -Raw
          foreach ($required in @('OpenAI Codex CLI 0.144.4','Apache License','Version 2.0','OpenAI Codex','Ratatui')) {
            if (-not $noticeText.Contains($required)) { Write-Error "第三方许可证缺少：$required"; exit 1 }
          }
          $proc = Start-Process -FilePath "$dir\LaTeXStruct.exe" -ArgumentList "--server","--port","8099" -PassThru
          $ok = $false
          $observedVersion = "<未响应>"
          $expectedCommit = $env:GITHUB_SHA.ToLowerInvariant()
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8099/api/health" -TimeoutSec 3
              if ($h.ok) {
                $observedVersion = [string]$h.version
                if (
                  $observedVersion -eq $env:APP_VERSION -and
                  [string]$h.commit -eq $expectedCommit -and
                  [string]$h.build_id -eq $env:GITHUB_RUN_ID
                ) {
                  $pageResponse = Invoke-WebRequest "http://127.0.0.1:8099/" -UseBasicParsing -TimeoutSec 5
                  if ($pageResponse.Content -notmatch '<div\s+id=["'']root["'']') {
                    Write-Error "安装版没有提供 React 工作台，疑似错误回退到旧前端"
                    exit 1
                  }
                  $assetMatches = [regex]::Matches(
                    $pageResponse.Content,
                    '(?:src|href)=["''](/assets/[^"'']+\.(?:js|css))["'']'
                  )
                  $assetPaths = @(
                    $assetMatches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
                  )
                  if ($assetPaths.Count -lt 2) {
                    Write-Error "React 首页缺少带哈希的 JS/CSS 资源引用"
                    exit 1
                  }
                  foreach ($assetPath in $assetPaths) {
                    if ($assetPath -notmatch '^/assets/.+-[A-Za-z0-9_-]{6,}\.(?:js|css)$') {
                      Write-Error "React 资源名未带内容哈希: $assetPath"
                      exit 1
                    }
                    $asset = Invoke-WebRequest "http://127.0.0.1:8099$assetPath" `
                      -UseBasicParsing -TimeoutSec 10
                    if ($asset.StatusCode -ne 200 -or $asset.RawContentLength -le 0) {
                      Write-Error "React 资源不可用: $assetPath"
                      exit 1
                    }
                  }
                  $ok = $true
                  Write-Host "安装版运行正常（React 工作台与静态资源完整）: v$observedVersion"
                } else {
                  Write-Host "安装版身份不匹配: expected=$env:APP_VERSION/$expectedCommit/$env:GITHUB_RUN_ID actual=$observedVersion/$($h.commit)/$($h.build_id)"
                }
                break
              }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          # 单文件 exe 有引导父子进程：全部结束，避免锁文件导致卸载残留
          Get-Process LaTeXStruct -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (-not $ok) {
            Write-Error "安装版健康检查失败或版本不匹配: expected=$env:APP_VERSION actual=$observedVersion"
            exit 1
          }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $gone = $false
          foreach ($i in 1..10) {
            Start-Sleep -Seconds 2
            if (-not (Test-Path "$dir\LaTeXStruct.exe")) { $gone = $true; break }
          }
          if (-not $gone) { Write-Error "静默卸载后残留文件"; exit 1 }
          Write-Host "安装器冒烟测试通过（安装→运行→卸载）"
      - name: 上一版自动更新冒烟（运行中 → 当前版本）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 只需在发布时更换这一处基线。测试下面的完整链路：
          # schedule_installer_after_exit -> 旧应用退出 -> 安装 -> 新应用重启。
          $previousVersion = '1.2.10'
          $previousTag = "v$previousVersion"
          $headers = @{
            'User-Agent' = 'latexstruct-upgrade-smoke'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
          }
          $release = Invoke-RestMethod -Headers $headers `
            "https://api.github.com/repos/Ararataki-number-one/LaTeXStruct/releases/tags/$previousTag"
          $asset = $release.assets | Where-Object {
            $_.name -eq "LaTeXStruct-setup-$previousVersion.exe"
          } | Select-Object -First 1
          if (-not $asset) { Write-Error "公开 $previousTag 安装器不存在"; exit 1 }
          $oldSetup = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $oldSetup
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            Write-Error "$previousTag 安装器缺少 SHA-256 摘要"; exit 1
          }
          $expectedOldHash = $Matches[1]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $oldSetup).Hash
          if ($actual -ne $expectedOldHash) {
            Write-Error "$previousTag 安装器摘要校验失败"; exit 1
          }

          $upgradeDir = Join-Path $env:LOCALAPPDATA 'Programs\LaTeXStruct-Upgrade-Smoke'
          $upgradeRestartLog = Join-Path $env:LOCALAPPDATA 'LaTeXStruct\update-restart.log'
          $currentSetup = Get-ChildItem dist/LaTeXStruct-setup-*.exe | Select-Object -First 1
          if (-not $currentSetup) { Write-Error '未找到当前版本安装器'; exit 1 }
          $oldProc = $null
          try {
            Start-Process -FilePath $oldSetup -ArgumentList `
              '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$upgradeDir" -Wait
            if (-not (Test-Path "$upgradeDir\LaTeXStruct.exe")) {
              Write-Error "$previousTag 安装失败"; exit 1
            }
            $installedExe = (Resolve-Path -LiteralPath "$upgradeDir\LaTeXStruct.exe").Path
            $oldProc = Start-Process -FilePath $installedExe `
              -ArgumentList '--server','--port','8100' -PassThru
            $oldHealthy = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8100/api/health' -TimeoutSec 3
                if ($health.ok -and [string]$health.version -eq $previousVersion) {
                  $oldHealthy = $true
                  break
                }
              } catch {}
            }
            if (-not $oldHealthy) {
              Write-Error "运行中的 $previousTag 健康检查失败"; exit 1
            }

            # 这是应用内“点击更新”的真实第一阶段，不再直接运行安装器。
            # 路径通过环境变量传入，避免将 runner 路径拼接成可执行脚本。
            $env:LATEXSTRUCT_SMOKE_INSTALLER = $currentSetup.FullName
            $env:LATEXSTRUCT_SMOKE_OLD_PID = [string]$oldProc.Id
            $env:LATEXSTRUCT_SMOKE_TARGET = $installedExe
            $env:LATEXSTRUCT_SMOKE_PREVIOUS_VERSION = $previousVersion
            $helperOutput = python -c "import os; from latexstruct.updater import schedule_installer_after_exit; print(schedule_installer_after_exit(os.environ['LATEXSTRUCT_SMOKE_INSTALLER'], app_pid=int(os.environ['LATEXSTRUCT_SMOKE_OLD_PID']), target_executable=os.environ['LATEXSTRUCT_SMOKE_TARGET'], previous_version=os.environ['LATEXSTRUCT_SMOKE_PREVIOUS_VERSION'], expected_version=os.environ['APP_VERSION']).pid)"
            if ($LASTEXITCODE -ne 0) {
              Write-Error '应用内更新 helper 调度失败'; exit 1
            }
            $helperPidText = [string]($helperOutput | Select-Object -Last 1)
            $helperPid = 0
            if (-not [int]::TryParse($helperPidText.Trim(), [ref]$helperPid) -or $helperPid -le 0) {
              Write-Error "更新 helper 没有返回有效 PID: $helperPidText"; exit 1
            }

            # 模拟 schedule 成功后桌面应用执行 WM_CLOSE。PyInstaller 是父子
            # 进程，所以只关闭这一安装路径的旧进程，不伤及 runner 上其它任务。
            $oldProcessIds = @(
              Get-CimInstance Win32_Process -Filter "Name = 'LaTeXStruct.exe'" |
                Where-Object { [string]$_.ExecutablePath -ieq $installedExe } |
                ForEach-Object { [int]$_.ProcessId }
              [int]$oldProc.Id
            ) | Sort-Object -Unique
            foreach ($processId in $oldProcessIds) {
              Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
            }
            $oldExited = $false
            foreach ($i in 1..30) {
              if (-not (Get-Process -Id $oldProc.Id -ErrorAction SilentlyContinue)) {
                $oldExited = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $oldExited) { Write-Error '旧版 PyInstaller 主进程仍未退出'; exit 1 }

            # 必须连续多次健康，防止“刚启动一次就崩溃”也被误判为成功。
            $newHealthy = $false
            $consecutiveHealthy = 0
            $observed = '<未响应>'
            foreach ($i in 1..75) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 3
                if ($health.ok) {
                  $observed = [string]$health.version
                  if (
                    $observed -eq $env:APP_VERSION -and
                    [string]$health.commit -eq $env:GITHUB_SHA.ToLowerInvariant() -and
                    [string]$health.build_id -eq $env:GITHUB_RUN_ID
                  ) {
                    $consecutiveHealthy += 1
                    if ($consecutiveHealthy -ge 4) { $newHealthy = $true; break }
                  } else {
                    $consecutiveHealthy = 0
                  }
                }
              } catch { $consecutiveHealthy = 0 }
            }
            if (-not $newHealthy) {
              if (Test-Path $upgradeRestartLog) {
                Write-Host '--- update restart helper log ---'
                Get-Content -LiteralPath $upgradeRestartLog -Tail 80
              } else {
                Write-Host 'Update restart helper did not create its first log line.'
              }
              Write-Error "升级后未自动启动当前版本: expected=$env:APP_VERSION actual=$observed"
              exit 1
            }

            # 更新后必须仍是 React 工作台，且 HTML 引用的带 hash JS/CSS 均能真实读取。
            $upgradePage = Invoke-WebRequest 'http://127.0.0.1:8765/' `
              -UseBasicParsing -TimeoutSec 10
            if ($upgradePage.Content -notmatch '<div\s+id=["'']root["'']') {
              Write-Error '升级后没有提供 React 工作台'; exit 1
            }
            $upgradeAssetMatches = [regex]::Matches(
              $upgradePage.Content,
              '(?:src|href)=["''](/assets/[^"'']+\.(?:js|css))["'']'
            )
            $upgradeAssetPaths = @(
              $upgradeAssetMatches | ForEach-Object { $_.Groups[1].Value } |
                Sort-Object -Unique
            )
            if ($upgradeAssetPaths.Count -lt 2) {
              Write-Error '升级后 React 首页缺少带 hash 的 JS/CSS 资源'; exit 1
            }
            foreach ($assetPath in $upgradeAssetPaths) {
              if ($assetPath -notmatch '^/assets/.+-[A-Za-z0-9_-]{6,}\.(?:js|css)$') {
                Write-Error "升级后 React 资源名未带内容 hash: $assetPath"; exit 1
              }
              $upgradeAsset = Invoke-WebRequest "http://127.0.0.1:8765$assetPath" `
                -UseBasicParsing -TimeoutSec 10
              if ($upgradeAsset.StatusCode -ne 200 -or $upgradeAsset.RawContentLength -le 0) {
                Write-Error "升级后 React 资源不可用: $assetPath"; exit 1
              }
            }

            $updated = Invoke-RestMethod 'http://127.0.0.1:8765/api/update/result' -TimeoutSec 5
            if (-not $updated.updated -or [string]$updated.previous -ne $previousVersion -or
                [string]$updated.current -ne $env:APP_VERSION) {
              Write-Error "升级成功提示状态错误: $($updated | ConvertTo-Json -Compress)"
              exit 1
            }
            Write-Host "上一版自动更新通过：$previousTag → v$env:APP_VERSION"
          } finally {
            Get-Process LaTeXStruct -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            if (Test-Path "$upgradeDir\unins000.exe") {
              Start-Process -FilePath "$upgradeDir\unins000.exe" -ArgumentList `
                '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            }
          }
      - name: 最终安装器字节绑定（未签名候选静默安装 → EXE SHA → 卸载）
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem dist/LaTeXStruct-setup-*.exe)
          if ($setups.Count -ne 1) {
            Write-Error "候选必须且只能有一个安装器，实际为 $($setups.Count) 个"
            exit 1
          }
          $setup = $setups[0]
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LaTeXStruct-Final-Asset-Smoke'
          $installedExe = Join-Path $dir 'LaTeXStruct.exe'
          $uninstaller = Join-Path $dir 'unins000.exe'
          try {
            $install = Start-Process -FilePath $setup.FullName -ArgumentList `
              '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" `
              -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "最终安装器静默安装失败，exit=$($install.ExitCode)"
            }
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
              throw '最终安装器没有安装 LaTeXStruct.exe'
            }
            $candidateHash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/LaTeXStruct.exe').Hash.ToLowerInvariant()
            $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedExe).Hash.ToLowerInvariant()
            if ($installedHash -ne $candidateHash) {
              throw "最终安装器内 EXE 与候选 EXE 字节不一致: candidate=$candidateHash installed=$installedHash"
            }
            Write-Host "最终安装器已安装候选精确 EXE 字节: $candidateHash"
          } finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList `
                '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) {
                Write-Error "最终安装器静默卸载失败，exit=$($uninstall.ExitCode)"
              }
            }
          }
          foreach ($i in 1..10) {
            if (-not (Test-Path -LiteralPath $installedExe)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $installedExe) {
            Write-Error '最终安装器静默卸载后仍残留 EXE'
            exit 1
          }
      - name: 打包便携版与第三方许可证
        shell: pwsh
        run: |
          $notice = 'packaging/THIRD_PARTY_NOTICES.txt'
          if (-not (Test-Path $notice)) { Write-Error '缺少第三方许可证'; exit 1 }
          $portable = "dist/LaTeXStruct-portable-$env:APP_VERSION.zip"
          python packaging/release_integrity.py build-portable `
            --executable dist/LaTeXStruct.exe --license LICENSE `
            --notices $notice --output $portable
          if ($LASTEXITCODE -ne 0) { Write-Error '便携包完整性校验失败'; exit 1 }
          $setup = Get-ChildItem dist/LaTeXStruct-setup-*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error '未找到已签名安装器'; exit 1 }
          python packaging/release_integrity.py record-assets `
            --version $env:APP_VERSION --commit $env:GITHUB_SHA `
            --build-id $env:GITHUB_RUN_ID --output dist/release-assets.json `
            --checksums-output dist/SHA256SUMS.txt $portable $setup.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error '发布资产摘要生成失败'; exit 1 }
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LaTeXStruct-v${{ env.APP_VERSION }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/LaTeXStruct-portable-*.zip
            dist/LaTeXStruct-setup-*.exe
            dist/release-assets.json
            dist/SHA256SUMS.txt

  trusted_analysis_37:
    name: 调用同一 run 的私有 analysis-37 完整验收
    needs: build_candidate
    if: github.event_name == 'workflow_dispatch' && inputs.run_analysis_37
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/analysis-37-acceptance.yml
    with:
      candidate_run_id: ${{ github.run_id }}
      version: ${{ needs.build_candidate.outputs.app_version }}
      runner_label: ${{ inputs.runner_label }}

  release_attested_candidate:
    name: 发布严格 37 页完整验收过的原始候选字节（仅 tag）
    needs: test
    # 带连字符的 tag 是明确标注的预发行版；它们只能由人工以 prerelease
    # 方式发布，不能进入或削弱下方稳定版 37 页完整验收门。
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: 版本一致性校验
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v').Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "版本格式无效: $v"; exit 1
          }
          python -c "import latexstruct; assert latexstruct.__version__=='$v', f'版本不匹配: {latexstruct.__version__} vs $v'"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 发布门（定位已完成且严格 37 页完整验收过的候选 run）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error '无法读取 origin/main，发布门保持关闭'; exit 1
          }
          $mainSha = (git rev-parse 'refs/remotes/origin/main').Trim().ToLowerInvariant()
          $tagSha = ([string]$env:GITHUB_SHA).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $mainSha) {
            Write-Error '稳定 tag 必须精确指向 origin/main 当前 HEAD，禁止在旧祖先提交发布'; exit 1
          }
          $manifest = "release/acceptance/v$env:APP_VERSION/release-attestation.json"
          $referenceManifest = "release/acceptance/v$env:APP_VERSION/github-acceptance-reference.json"
          if (
            -not (Test-Path -LiteralPath $manifest) -or
            -not (Test-Path -LiteralPath $referenceManifest)
          ) {
            Write-Error '缺少严格 analysis-37 发布投影或 GitHub 受信 run 引用'
            exit 1
          }
          try {
            $attestation = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            $reference = Get-Content -LiteralPath $referenceManifest -Raw | ConvertFrom-Json
            $attestedCommit = ([string]$attestation.commit).ToLowerInvariant()
            $candidateRunId = [string]$attestation.runtime_identity.build_id
            $acceptanceRunId = [string]$reference.acceptance_run.run_id
            $acceptanceWorkflowPath = [string]$reference.acceptance_run.workflow_path
            $acceptanceRunnerLabel = [string]$reference.acceptance_run.runner_label
            $payloadArtifactName = [string]$reference.artifacts.payload
            $closureArtifactName = [string]$reference.artifacts.closure
          } catch {
            Write-Error '真实验收声明或 GitHub 受信引用不是有效 JSON'; exit 1
          }
          if ($attestedCommit -notmatch '^[0-9a-f]{40,64}$') {
            Write-Error '真实验收声明缺少有效 tested commit'; exit 1
          }
          if ($candidateRunId -notmatch '^[1-9][0-9]*$') {
            Write-Error '真实验收 build_id 不是数字 GitHub Actions run id'; exit 1
          }
          if ($acceptanceRunId -notmatch '^[1-9][0-9]*$') {
            Write-Error 'GitHub acceptance run id 不是数字'; exit 1
          }
          if ($acceptanceRunnerLabel -cnotmatch '^latexstruct-acceptance-[0-9a-f]{32}$') {
            Write-Error 'GitHub acceptance 未绑定一次性 JIT runner 标签'; exit 1
          }
          $sameRun = $candidateRunId -eq $acceptanceRunId
          if (
            ($sameRun -and $acceptanceWorkflowPath -ne '.github/workflows/build.yml') -or
            (-not $sameRun -and $acceptanceWorkflowPath -ne '.github/workflows/analysis-37-acceptance.yml')
          ) {
            Write-Error 'GitHub acceptance workflow 模式与候选 run 身份不一致'; exit 1
          }
          git merge-base --is-ancestor $attestedCommit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) {
            Write-Error '真实验收所测提交不是 tag 提交的祖先'; exit 1
          }
          # 验收 JSON 本身会产生后续提交，因此不可能与被测 commit 自引用。
          # 被测 commit 到 tag 之间仅允许加入验收证据和发布说明；任何运行时代码
          # 变化都要求重新构建候选、重新执行同一 37 页文档的
          # OCR、分析/审阅、编译、全页视觉闭环和审计包验证。
          $evidencePrefix = "release/acceptance/v$env:APP_VERSION/"
          $changedPaths = @(git diff --name-only "$attestedCommit..$env:GITHUB_SHA")
          if ($LASTEXITCODE -ne 0) {
            Write-Error '无法核对被测提交到 tag 的文件变化'; exit 1
          }
          foreach ($changedPath in $changedPaths) {
            $normalizedPath = ([string]$changedPath).Replace('\','/')
            if (
              $normalizedPath -ne 'CHANGELOG.md' -and
              -not $normalizedPath.StartsWith($evidencePrefix)
            ) {
              Write-Error "真实验收后仍修改了运行时文件，禁止发布: $normalizedPath"
              exit 1
            }
          }
          $evidenceFiles = @(
            git ls-tree -r --name-only "$env:GITHUB_SHA" -- $evidencePrefix
          )
          if (
            $evidenceFiles.Count -ne 2 -or
            $evidenceFiles -notcontains $manifest -or
            $evidenceFiles -notcontains $referenceManifest
          ) {
            Write-Error '验收目录只能提交 release-attestation.json 与 github-acceptance-reference.json；禁止上传源 PDF、候选 PDF、逐页图或完整审计包'
            exit 1
          }
          $forbiddenEvidence = @(
            git ls-tree -r --name-only "$env:GITHUB_SHA" |
              Where-Object {
                $leaf = Split-Path -Leaf ([string]$_)
                $leaf -eq 'SOME RECENT RESULTS IN RAMSEY THEORY.pdf' -or
                $leaf -eq 'candidate.pdf' -or
                $leaf -eq 'analysis-audit-submission.zip' -or
                (
                  ([string]$_).Replace('\','/').StartsWith('release/acceptance/') -and
                  [IO.Path]::GetExtension($leaf) -match '^\.(pdf|png|jpg|jpeg)$'
                )
              }
          )
          if ($forbiddenEvidence.Count -gt 0) {
            Write-Error "仓库包含禁止公开的 37 页验收工件: $($forbiddenEvidence -join ', ')"
            exit 1
          }
          python packaging/release_integrity.py verify-attestation `
            --manifest $manifest --version $env:APP_VERSION --commit $attestedCommit
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'analysis-37 真实完整验收的哈希投影未通过发布门'
            exit 1
          }
          python packaging/release_integrity.py verify-release-notes `
            --changelog CHANGELOG.md --readme README.md `
            --version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'CHANGELOG 含未来 CI 资产摘要或缺少当前版本说明'; exit 1
          }
          $headers = @{
            'User-Agent' = 'latexstruct-release-gate'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $candidateRun = Invoke-RestMethod -Headers $headers `
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId"
          } catch {
            Write-Error "无法核验候选 GitHub Actions run $candidateRunId"; exit 1
          }
          if (
            [string]$candidateRun.id -ne $candidateRunId -or
            [string]$candidateRun.event -ne 'workflow_dispatch' -or
            [string]$candidateRun.status -ne 'completed' -or
            [string]$candidateRun.conclusion -ne 'success' -or
            [string]$candidateRun.path -ne '.github/workflows/build.yml' -or
            [int]$candidateRun.run_attempt -ne 1 -or
            ([string]$candidateRun.head_sha).ToLowerInvariant() -ne $attestedCommit
          ) {
            Write-Error "候选 run 未完成、非手动构建、失败或 commit 不匹配: $candidateRunId"
            exit 1
          }
          try {
            $acceptanceRun = Invoke-RestMethod -Headers $headers `
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$acceptanceRunId"
            $acceptanceArtifacts = Invoke-RestMethod -Headers $headers `
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$acceptanceRunId/artifacts?per_page=100"
          } catch {
            Write-Error "无法核验受信 analysis-37 GitHub run/artifacts $acceptanceRunId"; exit 1
          }
          if (
            [string]$acceptanceRun.id -ne $acceptanceRunId -or
            [string]$acceptanceRun.event -ne 'workflow_dispatch' -or
            [string]$acceptanceRun.status -ne 'completed' -or
            [string]$acceptanceRun.conclusion -ne 'success' -or
            [string]$acceptanceRun.path -ne $acceptanceWorkflowPath -or
            [int]$acceptanceRun.run_attempt -ne 1 -or
            ([string]$acceptanceRun.head_sha).ToLowerInvariant() -ne $attestedCommit -or
            [string]$acceptanceRun.repository.full_name -ne $env:GITHUB_REPOSITORY
          ) {
            Write-Error '受信 analysis-37 run 不是同仓库、同提交、首次成功的规定 workflow'
            exit 1
          }
          $artifacts = @($acceptanceArtifacts.artifacts)
          $payloadArtifacts = @($artifacts | Where-Object { $_.name -eq $payloadArtifactName })
          $closureArtifacts = @($artifacts | Where-Object { $_.name -eq $closureArtifactName })
          $candidateArtifactName = "LaTeXStruct-v$env:APP_VERSION"
          $candidateArtifacts = @(
            $artifacts | Where-Object { $_.name -eq $candidateArtifactName }
          )
          $expectedArtifactCount = if ($sameRun) { 3 } else { 2 }
          if (
            [int]$acceptanceArtifacts.total_count -ne $expectedArtifactCount -or
            $artifacts.Count -ne $expectedArtifactCount -or
            $payloadArtifacts.Count -ne 1 -or
            $closureArtifacts.Count -ne 1 -or
            ($sameRun -and $candidateArtifacts.Count -ne 1) -or
            (-not $sameRun -and $candidateArtifacts.Count -ne 0)
          ) {
            Write-Error '受信 analysis-37 run artifact 清单与调用模式不一致'
            exit 1
          }
          $payloadArtifact = $payloadArtifacts[0]
          $closureArtifact = $closureArtifacts[0]
          $trustedArtifacts = @($payloadArtifact, $closureArtifact)
          if ($sameRun) { $trustedArtifacts += $candidateArtifacts[0] }
          foreach ($artifact in $trustedArtifacts) {
            if (
              [string]$artifact.id -notmatch '^[1-9][0-9]*$' -or
              [bool]$artifact.expired -or
              [string]$artifact.digest -notmatch '^sha256:[0-9a-fA-F]{64}$' -or
              [string]$artifact.workflow_run.id -ne $acceptanceRunId -or
              ([string]$artifact.workflow_run.head_sha).ToLowerInvariant() -ne $attestedCommit
            ) {
              Write-Error '受信 artifact 已过期、无 digest 或未绑定 acceptance run'; exit 1
            }
          }
          $trustDir = Join-Path $env:RUNNER_TEMP `
            "latexstruct-tag-trust-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $trustDir) {
            Write-Error 'tag trust 临时目录已存在，拒绝复用'; exit 1
          }
          New-Item -ItemType Directory -Path $trustDir | Out-Null
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText(
            (Join-Path $trustDir 'acceptance-run.json'),
            ($acceptanceRun | ConvertTo-Json -Depth 100),
            $utf8NoBom
          )
          [IO.File]::WriteAllText(
            (Join-Path $trustDir 'acceptance-artifacts.json'),
            ($acceptanceArtifacts | ConvertTo-Json -Depth 100),
            $utf8NoBom
          )
          "ATTESTED_COMMIT=$attestedCommit" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_RUN_ID=$candidateRunId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACCEPTANCE_RUN_ID=$acceptanceRunId" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_ARTIFACT_ID=$($payloadArtifact.id)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLOSURE_ARTIFACT_ID=$($closureArtifact.id)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRUST_METADATA_DIR=$trustDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 下载并验证 GitHub 受信 acceptance artifact 闭包
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            'User-Agent' = 'latexstruct-release-gate'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $payloadZip = Join-Path $env:TRUST_METADATA_DIR 'payload.zip'
          $closureZip = Join-Path $env:TRUST_METADATA_DIR 'closure.zip'
          try {
            Invoke-WebRequest -Headers $headers `
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:PAYLOAD_ARTIFACT_ID/zip" `
              -OutFile $payloadZip
            Invoke-WebRequest -Headers $headers `
              "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CLOSURE_ARTIFACT_ID/zip" `
              -OutFile $closureZip
          } catch {
            Write-Error '无法按 GitHub artifact ID 下载受信 payload/closure'; exit 1
          }
          $manifest = "release/acceptance/v$env:APP_VERSION/release-attestation.json"
          $referenceManifest = "release/acceptance/v$env:APP_VERSION/github-acceptance-reference.json"
          python packaging/release_integrity.py verify-github-acceptance `
            --reference-manifest $referenceManifest `
            --release-manifest $manifest `
            --run-metadata (Join-Path $env:TRUST_METADATA_DIR 'acceptance-run.json') `
            --artifacts-metadata (Join-Path $env:TRUST_METADATA_DIR 'acceptance-artifacts.json') `
            --payload-archive $payloadZip --closure-archive $closureZip `
            --repository $env:GITHUB_REPOSITORY `
            --version $env:APP_VERSION --commit $env:ATTESTED_COMMIT
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'GitHub 受信 analysis-37 run/artifact/closure 未形成可重算闭包'
            exit 1
          }
      - name: 下载先前候选 run 的不可变发布资产
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LaTeXStruct-v${{ env.APP_VERSION }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
      - name: 复算候选资产并绑定严格 37 页完整验收
        shell: pwsh
        run: |
          $manifest = "release/acceptance/v$env:APP_VERSION/release-attestation.json"
          python packaging/release_integrity.py verify-candidate-assets `
            --manifest $manifest --version $env:APP_VERSION `
            --commit $env:ATTESTED_COMMIT `
            --assets-manifest dist/release-assets.json `
            --checksums dist/SHA256SUMS.txt --assets-dir dist
          if ($LASTEXITCODE -ne 0) {
            Write-Error '候选资产不是 analysis-37 实际验收过的精确字节，禁止发布'
            exit 1
          }
      - name: 生成当前版本中文发布说明
        shell: pwsh
        run: |
          $escaped = [regex]::Escape($env:APP_VERSION)
          $match = [regex]::Match(
            (Get-Content CHANGELOG.md -Raw),
            "(?ms)^## v$escaped（[^\r\n]+）\r?\n(?<body>.*?)(?=^## |\z)"
          )
          if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups['body'].Value)) {
            Write-Error "CHANGELOG 缺少 v$env:APP_VERSION 的发布说明"
            exit 1
          }
          $match.Groups['body'].Value.Trim() |
            Set-Content dist/RELEASE_NOTES.md -Encoding utf8NoBOM
      - name: 发布瞬间再次校验 tag 与 origin/main 当前 HEAD
        shell: pwsh
        run: |
          $mainGateRef = 'refs/release-gate/origin-main'
          $tagGateRef = 'refs/release-gate/stable-tag'
          $mainRefSpec = 'refs/heads/main:' + $mainGateRef
          $tagRefSpec = 'refs/tags/' + $env:GITHUB_REF_NAME + ':' + $tagGateRef
          git fetch --force --no-tags origin $mainRefSpec $tagRefSpec
          if ($LASTEXITCODE -ne 0) {
            Write-Error '发布前无法重新读取 origin/main 与远端 tag，发布门保持关闭'
            exit 1
          }
          $mainSha = (git rev-parse "$mainGateRef^{commit}").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { Write-Error '无法解析最新 origin/main'; exit 1 }
          $remoteTagSha = (git rev-parse "$tagGateRef^{commit}").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { Write-Error '无法解析最新远端 tag'; exit 1 }
          $checkoutSha = (git rev-parse 'HEAD^{commit}').Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { Write-Error '无法解析当前 checkout'; exit 1 }
          $eventSha = ([string]$env:GITHUB_SHA).Trim().ToLowerInvariant()
          if (
            $mainSha -ne $remoteTagSha -or
            $mainSha -ne $checkoutSha -or
            $mainSha -ne $eventSha
          ) {
            Write-Error "发布瞬间身份漂移: main=$mainSha remoteTag=$remoteTagSha checkout=$checkoutSha event=$eventSha"
            exit 1
          }
      - name: 发布 GitHub Release（复用已验收候选原始字节）
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/LaTeXStruct-portable-${{ env.APP_VERSION }}.zip
            dist/LaTeXStruct-setup-${{ env.APP_VERSION }}.exe
            dist/release-assets.json
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
