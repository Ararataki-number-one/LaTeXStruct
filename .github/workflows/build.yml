name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建版本（留空则使用 latexstruct/_version.py）"
        required: false
        type: string

jobs:
  test:
    name: 测试（Windows / Python 3.13）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: python -m pip install -r requirements.txt ruff
      - name: 静态检查（ruff F/E741/W605 规则）
        run: python -m ruff check latexstruct tests tools packaging benchmark
      - name: 运行全部测试套件
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { Write-Error "测试失败"; exit 1 }
          python tools/benchmark.py | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Benchmark 未通过"; exit 1 }
          Write-Host "全部测试通过"
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: 安装 TinyTeX（Compile CI）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 用 GITHUB_TOKEN 认证 GitHub API（匿名调用在共享 runner IP 上频繁触发限流，
          # 曾导致误报 CI 失败）；带 3 次退避重试。
          $rel = $null
          for ($i = 0; $i -lt 3 -and -not $rel; $i++) {
            try {
              $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'latexstruct-ci'; `
                'Authorization' = "Bearer $env:GITHUB_TOKEN" } `
                https://api.github.com/repos/rstudio/tinytex-releases/releases/latest
            } catch { Start-Sleep -Seconds (5 * ($i + 1)) }
          }
          if (-not $rel) { Write-Error "TinyTeX 版本查询失败（API 限流）"; exit 1 }
          $asset = $rel.assets | Where-Object { $_.name -like 'TinyTeX-0-windows-v*.exe' } | Select-Object -First 1
          if (-not $asset) { Write-Error "未找到 TinyTeX Windows 资产"; exit 1 }
          $exe = Join-Path $env:RUNNER_TEMP 'tinytex.exe'
          Invoke-WebRequest $asset.browser_download_url -OutFile $exe
          $root = Join-Path $env:RUNNER_TEMP 'tinytex'
          & $exe -o"$root" -y
          $tlmgr = Get-ChildItem -Path $root -Recurse -Filter tlmgr.bat | Select-Object -First 1
          if (-not $tlmgr) { Write-Error "解压后未找到 tlmgr"; exit 1 }
          $bin = $tlmgr.DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          # amssymb.sty 属于 amsfonts，amsthm.sty 属于 amscls；这里必须使用
          # TeX Live 的发行包名，而不是 .sty 文件名。
          & $tlmgr.FullName install xetex amsmath amsfonts amscls geometry tcolorbox graphics
          if ($LASTEXITCODE -ne 0) { Write-Error "TinyTeX 依赖安装失败"; exit 1 }
          $kpsewhich = Join-Path $bin 'kpsewhich.exe'
          $xelatex = Join-Path $bin 'xelatex.exe'
          if (-not (Test-Path $kpsewhich)) { Write-Error "TinyTeX 缺少 kpsewhich"; exit 1 }
          if (-not (Test-Path $xelatex)) { Write-Error "TinyTeX 缺少 xelatex"; exit 1 }
          foreach ($file in @('amsmath.sty', 'amssymb.sty', 'amsthm.sty', 'tcolorbox.sty')) {
            $resolved = & $kpsewhich $file
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resolved)) {
              Write-Error "TinyTeX 依赖缺失: $file"; exit 1
            }
            Write-Host "TinyTeX 依赖就绪: $file -> $resolved"
          }
      - name: Benchmark（含前后编译对比）
        shell: pwsh
        run: |
          python tools/benchmark.py --compile
          $benchmarkExit = $LASTEXITCODE
          Get-Content benchmark/report.md
          if ($benchmarkExit -ne 0) { Write-Error "Benchmark（编译）未通过"; exit 1 }

  build:
    name: 构建安装包（仅 tag / 手动触发）
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 版本一致性校验（tag 与 __version__）
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            $v = $env:MANUAL_VERSION.TrimStart('v')
          } else {
            $v = python -c "from latexstruct._version import __version__; print(__version__)"
          }
          $v = $v.Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "版本格式无效: $v"; exit 1 }
          python -c "import latexstruct; assert latexstruct.__version__=='$v', f'版本不匹配: {latexstruct.__version__} vs $v'"
          echo "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller
      - name: 生成图标与版本资源
        shell: pwsh
        run: |
          python packaging/generate_icon.py
          python packaging/sync_version.py --version $env:APP_VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建 React 前端（Monaco 工作台）
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: PyInstaller 构建单文件 exe
        run: python -m PyInstaller packaging/LaTeXStruct.spec --noconfirm --distpath dist --workpath build
      - name: 代码签名 exe（配置了证书 secrets 时）
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_BASE64)) {
            Write-Host "未配置签名证书，跳过签名"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/LaTeXStruct.exe
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress
      - name: 构建安装器
        shell: pwsh
        run: |
          iscc "/DAppVersion=$env:APP_VERSION" packaging/installer.iss
          Get-ChildItem dist
      - name: 安装器冒烟测试（静默安装 → 运行健康检查 → 静默卸载）
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/LaTeXStruct-setup-*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "未找到安装器"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\LaTeXStruct-Smoke"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\LaTeXStruct.exe")) { Write-Error "安装后未找到 exe"; exit 1 }
          $proc = Start-Process -FilePath "$dir\LaTeXStruct.exe" -ArgumentList "--server","--port","8099" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8099/api/health" -TimeoutSec 3
              if ($h.ok) { $ok = $true; Write-Host "安装版运行正常: v$($h.version)"; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          # 单文件 exe 有引导父子进程：全部结束，避免锁文件导致卸载残留
          Get-Process LaTeXStruct -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (-not $ok) { Write-Error "安装版健康检查失败"; exit 1 }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $gone = $false
          foreach ($i in 1..10) {
            Start-Sleep -Seconds 2
            if (-not (Test-Path "$dir\LaTeXStruct.exe")) { $gone = $true; break }
          }
          if (-not $gone) { Write-Error "静默卸载后残留文件"; exit 1 }
          Write-Host "安装器冒烟测试通过（安装→运行→卸载）"
      - name: 代码签名安装器（配置了证书 secrets 时）
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_BASE64)) {
            Write-Host "未配置签名证书，跳过签名"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Get-ChildItem dist/LaTeXStruct-setup-*.exe | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LaTeXStruct-${{ github.ref_name }}
          path: |
            dist/LaTeXStruct.exe
            dist/LaTeXStruct-setup-*.exe
      - name: 发布 GitHub Release（tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LaTeXStruct.exe
            dist/LaTeXStruct-setup-*.exe
          generate_release_notes: true
