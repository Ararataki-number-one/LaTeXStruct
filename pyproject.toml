[project]
name = "latexstruct"
dynamic = ["version"]
description = "LaTeX 数学书结构化整理本地客户端"
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "latexstruct._version.__version__"}

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy",
    "openai",
    "pywebview",
]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latexstruct*"]

[tool.ruff]
line-length = 100
extend-exclude = ["build", "dist", "corpus"]

[tool.ruff.lint]
select = ["F", "E741", "W605"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E741"]
